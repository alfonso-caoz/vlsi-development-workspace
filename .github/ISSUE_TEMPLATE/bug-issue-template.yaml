name: 🐛 Bug Report
description: File a report for broken functionality.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to recreate the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 🛠️ Development Instructions: How to add your changes in the repository, if applicable
        1. Create a branch from `main` under the branch name format: `fix/<issue-number>-<issue-name-lowercase>`.
        2. A Pull Request (PR) is required to merge your branch changes to `main`.
        3. Once your PR is approved and passing all checks, proceed to squash and merge your PR to `main`.
